services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: nova
    volumes:
      - nova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://nova:${POSTGRES_PASSWORD:-change-this-password}@db:5432/nova
      NOVA_WORKSPACE_DIR: /app/data/workspace
      NOVA_ENV: production
    ports:
      - "8000:8000"
    volumes:
      - nova_workspace:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1}
    ports:
      - "3000:3000"

volumes:
  nova_pgdata:
  nova_workspace:
